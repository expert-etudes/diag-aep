<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Diagnostic AEP</title><meta name="theme-color" content="#0a5a73"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<style>
/* Layout : une seule colonne de grandes touches, barre haute fixe (retour + état GPS),
   pensée pour une main, en plein soleil. Polices du téléphone uniquement : l'appli doit
   tourner sans aucun réseau, donc aucun fichier externe. */
:root{
  --bg:#edf2f3; --surface:#ffffff; --ink:#0d2a33; --muted:#51656c; --line:#c5d3d8;
  --bar:#0a5a73; --bar-ink:#ffffff;
  --accent:#0a6a86; --accent-ink:#ffffff; --accent-soft:#d8ebf1;
  --ok:#1b7440; --ok-soft:#dbf0e2; --warn:#8f5a00; --warn-soft:#fbecc6;
  --bad:#b3261e; --bad-soft:#f9dcd9; --flow:#673d9c; --flow-soft:#e9def6;
  --on-tone:#ffffff;
  --font:system-ui,"Roboto","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --num:ui-monospace,"Roboto Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b171b; --surface:#13252b; --ink:#e7f0f2; --muted:#9fb3b9; --line:#2c444c;
    --bar:#10323c; --bar-ink:#e7f0f2;
    --accent:#4fb6d3; --accent-ink:#05222b; --accent-soft:#153843;
    --ok:#63c98a; --ok-soft:#173524; --warn:#e8b54a; --warn-soft:#3b2f10;
    --bad:#f08a82; --bad-soft:#43201d; --flow:#b99be6; --flow-soft:#2e2244;
    --on-tone:#0b171b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b171b; --surface:#13252b; --ink:#e7f0f2; --muted:#9fb3b9; --line:#2c444c;
  --bar:#10323c; --bar-ink:#e7f0f2;
  --accent:#4fb6d3; --accent-ink:#05222b; --accent-soft:#153843;
  --ok:#63c98a; --ok-soft:#173524; --warn:#e8b54a; --warn-soft:#3b2f10;
  --bad:#f08a82; --bad-soft:#43201d; --flow:#b99be6; --flow-soft:#2e2244;
  --on-tone:#0b171b; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.4 var(--font);-webkit-text-size-adjust:100%;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);color:var(--bar-ink)}
.top-in{display:flex;align-items:center;gap:10px;min-height:58px;max-width:720px;margin:0 auto;padding-block:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{flex:none;width:46px;height:46px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--bar-ink) 45%,transparent);background:none;color:var(--bar-ink);font-size:1.5rem;line-height:1}
.title{flex:1;min-width:0;margin:0;font-size:1.08rem;font-weight:700;line-height:1.2;text-wrap:balance}
.chip{flex:none;padding:6px 10px;border-radius:99px;font:700 .78rem var(--num);white-space:nowrap;background:color-mix(in srgb,var(--bar-ink) 16%,transparent);color:var(--bar-ink)}
.chip[data-s="ok"]{background:var(--ok-soft);color:var(--ok)}
.chip[data-s="low"]{background:var(--warn-soft);color:var(--warn)}
.chip[data-s="off"]{background:var(--bad-soft);color:var(--bad)}
.recband{background:var(--bad);color:var(--on-tone)}
.recband-in{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto;padding-block:8px;font-weight:700;font-size:.92rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.recband-in span{flex:1;min-width:0}
.recband button{flex:none;min-height:40px;padding:6px 14px;border-radius:8px;border:1.5px solid var(--on-tone);background:none;color:var(--on-tone);font-weight:700}

.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:26px;padding-block:18px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec>h2{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend,.fld>label:not(.filebtn),.lbl{display:block;padding:0;font-weight:700;font-size:.95rem}
legend{margin-bottom:6px}
.count{font:700 .8rem var(--num);color:var(--muted);margin-left:6px}
input[type=text],input[type=number],input[type=tel],input[type=date],select,textarea{
  width:100%;min-height:52px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.numrow{display:flex;align-items:center;gap:10px}
.numrow input{flex:1;min-width:0;font-family:var(--num)}
.unit{flex:none;min-width:3.2em;color:var(--muted);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{min-height:54px;padding:10px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:600;font-size:.95rem;line-height:1.25;text-align:center}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[data-tone="ok"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-tone)}
.opt[data-tone="warn"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--on-tone)}
.opt[data-tone="bad"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--on-tone)}
.opt[data-tone="flow"][aria-pressed="true"]{background:var(--flow);border-color:var(--flow);color:var(--on-tone)}

.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;padding:12px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger.sure{background:var(--bad);color:var(--on-tone)}
.btn.rec{background:var(--bad);border-color:var(--bad);color:var(--on-tone)}
.btn:disabled{opacity:.55}
.btnrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.filebtn{position:relative;cursor:pointer}
.filebtn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.link{display:block;padding:10px 4px;border:0;background:none;color:var(--accent);font-weight:700;text-align:center;text-decoration:underline}

.list{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:62px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;color:inherit;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:700}
.row .s{color:var(--muted);font-size:.86rem}
.row .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
button.row::after{content:"›";flex:none;color:var(--muted);font-size:1.5rem;line-height:1}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.76rem;font-weight:700;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.pill[data-tone="ok"]{background:var(--ok-soft);color:var(--ok)}
.pill[data-tone="warn"]{background:var(--warn-soft);color:var(--warn)}
.pill[data-tone="bad"]{background:var(--bad-soft);color:var(--bad)}
.pill[data-tone="flow"]{background:var(--flow-soft);color:var(--flow)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.empty{margin:0;color:var(--muted)}
.hint{margin:0;color:var(--muted);font-size:.88rem}
.miss{margin:0;padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.miss ul{margin:6px 0 0;padding-left:1.2em;font-weight:500}
.done{margin:0;padding:12px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:700}
.note{margin:0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:.92rem}
.gpsbox{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:12px;border:1.5px dashed var(--line);border-radius:10px;font-family:var(--num);font-size:.95rem;font-variant-numeric:tabular-nums}
.gpsbox .none{font-family:var(--font);color:var(--muted)}
.acc{font-weight:700;color:var(--ok)}
.acc.low{color:var(--warn)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumbs:empty{display:none}
.thumb{aspect-ratio:1;max-width:100%;padding:0;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.stat b{display:block;font:700 1.4rem var(--num);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.86rem}
.ptrow{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.ptrow:first-child{border-top:0}
.pthead{display:flex;align-items:center;gap:10px}
.pthead .main{flex:1;min-width:0}
.pthead .s{display:block;color:var(--muted);font:.8rem var(--num)}
.mini{flex:none;min-height:40px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--bad);font-weight:700;font-size:.86rem}
.iv{display:flex;flex-direction:column;gap:8px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}

.viewer{position:fixed;inset:0;z-index:20;overflow:auto;background:var(--bg);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.viewer-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.viewer img{display:block;width:100%;border-radius:8px;background:var(--surface)}
.meta{margin:0;color:var(--muted);font:.86rem var(--num)}
.strip{position:relative;display:flex;gap:8px;max-width:720px;margin:0 auto;overflow-x:auto;scrollbar-width:none;padding-block:4px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.strip::-webkit-scrollbar{display:none}
.sc{flex:none;max-width:70vw;min-height:42px;padding:6px 14px;border-radius:99px;border:1.5px solid color-mix(in srgb,var(--bar-ink) 45%,transparent);background:none;color:var(--bar-ink);font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc[aria-current="true"]{background:var(--bar-ink);border-color:var(--bar-ink);color:var(--bar)}
.sc.side{border-style:dashed}
.top :focus-visible{outline-color:var(--bar-ink)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tab{min-height:54px;padding:8px 4px;border:0;border-left:1.5px solid var(--line);background:none;color:var(--ink);font-weight:700;font-size:.95rem;line-height:1.2}
.tab:first-child{border-left:0}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] .count{color:inherit}
.tab:focus-visible{outline-offset:-4px;outline-color:currentColor}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(92vw,520px);padding:12px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700;text-align:center}
#app:empty::after{content:"Page vide ? Ce lecteur ne sait pas afficher l'appli. Ouvre le fichier avec Chrome : appui long sur le fichier, puis « Ouvrir avec », puis Chrome.";display:block;padding:14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:600;opacity:0;animation:late 0s 3s forwards}
@keyframes late{to{opacity:1}}
@media (max-width:330px){.opts,.btnrow,.stats{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.opt,.btn{transition:background-color .12s,border-color .12s}}
</style>

<header class="top">
  <div class="top-in">
    <button class="back" id="back" type="button" data-act="back" aria-label="Retour" hidden>‹</button>
    <h1 class="title" id="title">Diagnostic AEP</h1>
    <span class="chip" id="gps" data-s="wait">GPS…</span>
  </div>
  <nav class="strip" id="strip" aria-label="Fiches voisines" hidden></nav>
  <div class="recband" id="recband" hidden><div class="recband-in"><span id="rectxt"></span><button type="button" data-act="rec">Arrêter</button></div></div>
</header>
<main class="wrap" id="app"></main>
<div class="viewer" id="viewer" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
/* ---------- petits outils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const p2=n=>String(n).padStart(2,'0');
const fmtDate=t=>{const d=new Date(t);return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const isoDay=t=>{const d=new Date(t);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const frDay=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||'');return m?`${m[3]}/${m[2]}/${m[1]}`:(s||'')};
const san=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40);
const plur=(n,w)=>`${n} ${w}${n>1?'s':''}`;
const r6=x=>Math.round(x*1e6)/1e6;
function dist(a,b){const R=6371000,q=Math.PI/180,dl=(b.lat-a.lat)*q,dn=(b.lon-a.lon)*q,
  h=Math.sin(dl/2)**2+Math.cos(a.lat*q)*Math.cos(b.lat*q)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const traceLen=t=>{let s=0;for(let i=1;i<t.pts.length;i++)s+=dist(t.pts[i-1],t.pts[i]);return s};
let toastT;function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3200)}

/* ---------- définition des fiches ---------- */
const SIT={raccorde:['Raccordé','ok'],partiel:['Partiellement raccordé','warn'],non:['Non raccordé','bad'],debit:['Raccordé, problème de débit','flow']};
const OUV={puits:'Puits',forage:'Forage',source:'Source',reservoir:'Réservoir',pompage:'Station de pompage',borne:'Borne-fontaine',conduite:'Conduite',regard:'Regard / vanne',autre:'Autre ouvrage'};
const ETAT={bon:['Bon','ok'],moyen:['Moyen','warn'],degrade:['Dégradé','bad'],hs:['Hors service','bad']};
const TRACE={existante:'Conduite existante',projetee:'Conduite projetée',piste:"Piste d'accès"};
const SING=['Traversée de chaâba / oued','Traversée de route / piste','Terrain rocheux',"Opposition d'un riverain",'Changement de direction'];
const QUAL=['Président de la commune','Élu','Autorité locale','Association','Technicien de la commune','ONEE',"Maître d'ouvrage",'Habitant',"Bureau d'études",'Autre'];
const tones=o=>Object.entries(o).map(([v,[l,t]])=>[v,l,t]);
const F={
 douar:[
  {k:'situation',t:'choice',one:true,label:'Situation du douar',opts:tones(SIT)},
  {k:'menages',t:'num',label:'Nombre de ménages',unit:'ménages'},
  {k:'menages_nd',t:'num',label:'Ménages non desservis',unit:'ménages',if:f=>f.situation==='partiel'},
  {k:'quartiers_nd',t:'text',label:'Quartiers non desservis',if:f=>f.situation==='partiel'},
  {k:'problemes',t:'multi',label:'Problèmes sur le réseau',if:f=>f.situation&&f.situation!=='non',
   opts:['Pression faible','Coupures fréquentes','Eau quelques heures par jour',"Manque d'eau en été",'Fuites sur le réseau','Eau de mauvaise qualité','Compteurs absents ou en panne']},
  {k:'desserte',t:'multi',label:'Mode de desserte',if:f=>f.situation&&f.situation!=='non',opts:['Branchements individuels','Bornes-fontaines']},
  {k:'ressource',t:'multi',label:"D'où vient l'eau aujourd'hui",
   opts:['Réseau ONEE',"Réseau d'une association",'Puits','Forage','Source','Camion-citerne','Matfia (citerne enterrée)','Oued / séguia','Autre']},
  {k:'gestion',t:'choice',label:"Qui gère l'eau",opts:['Association','Commune','ONEE','Personne']},
  {k:'distance',t:'num',label:"Distance jusqu'au point d'eau",unit:'m',if:f=>f.situation==='non'||f.situation==='partiel'},
  {k:'electricite',t:'yn',label:'Électricité dans le douar'},
  {k:'equipements',t:'multi',label:'Équipements du douar',opts:['École','Mosquée','Dispensaire','Dar Taliba / internat','Souk','Autre']},
  {k:'demande',t:'text',label:'Demande des habitants'},
  {k:'note',t:'text',label:'Remarque'}
 ],
 ouvrage:[
  {k:'nom',t:'line',label:'Nom ou repère'},
  {k:'etat',t:'choice',label:'État',opts:tones(ETAT)},
  {k:'service',t:'yn',label:'En service'},
  {k:'profondeur',t:'num',label:'Profondeur',unit:'m',types:['puits','forage']},
  {k:'niveau',t:'num',label:"Niveau de l'eau sous le sol",unit:'m',types:['puits','forage']},
  {k:'diam_m',t:'num',label:'Diamètre du puits',unit:'m',types:['puits']},
  {k:'diam_mm',t:'num',label:'Diamètre',unit:'mm',types:['forage','conduite']},
  {k:'debit',t:'num',label:'Débit, si connu',unit:'l/s',types:['puits','forage','source','pompage']},
  {k:'pompe',t:'yn',label:"Équipé d'une pompe",types:['puits','forage']},
  {k:'energie',t:'choice',label:'Énergie',opts:['Électricité','Solaire','Gasoil','Aucune'],types:['puits','forage','pompage']},
  {k:'puissance',t:'num',label:'Puissance de la pompe, si connue',unit:'kW',types:['pompage']},
  {k:'captage',t:'yn',label:'Captage aménagé',types:['source']},
  {k:'capacite',t:'num',label:'Capacité',unit:'m³',types:['reservoir']},
  {k:'res_type',t:'choice',label:'Type de réservoir',opts:['Au sol','Semi-enterré','Surélevé'],types:['reservoir']},
  {k:'res_mat',t:'choice',label:'Matériau du réservoir',opts:['Béton','Maçonnerie','Plastique','Métal'],types:['reservoir']},
  {k:'robinets',t:'num',label:'Nombre de robinets',unit:'robinets',types:['borne']},
  {k:'compteur',t:'yn',label:'Compteur',types:['borne']},
  {k:'materiau',t:'choice',label:'Matériau de la conduite',opts:['PVC','PEHD','Acier galvanisé','Fonte','Amiante-ciment','Inconnu'],types:['conduite']},
  {k:'longueur',t:'num',label:'Longueur estimée',unit:'m',types:['conduite']},
  {k:'pose',t:'choice',label:'Pose',opts:['Enterrée','Apparente'],types:['conduite']},
  {k:'problemes',t:'multi',label:'Problèmes constatés',opts:['Fuite','Fissures','Pompe en panne','Tarissement','Ensablement','Pas de clôture ou de couvercle','Eau de mauvaise qualité','Vandalisme','Autre']},
  {k:'note',t:'text',label:'Remarque'}
 ]
};
const optsOf=d=>d.t==='yn'?[['oui','Oui'],['non','Non']]:d.opts.map(x=>Array.isArray(x)?x:[x,x]);
const shown=(d,f,type)=>(!d.if||d.if(f))&&(!d.types||d.types.includes(type));
function valText(d,v){

/* ---------- GPS ---------- */
let fix=null,gpsErr='';
const fresh=()=>fix&&Date.now()-fix.t<20000;
function startGps(){

  try{navigator.geolocation.watchPosition(p=>{gpsErr='';fix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy||0,t:Date.now()};onFix()},
    e=>{gpsErr=e&&e.code===1?'denied':'wait';chip()},{enableHighAccuracy:true,maximumAge:0,timeout:30000})}catch(e){gpsErr='none';chip()}
}
function chip(){const el=$('#gps');
  if(gpsErr==='denied'||gpsErr==='none'){el.dataset.s='off';el.textContent='GPS indisponible';return}
  if(!fresh()){el.dataset.s='wait';el.textContent='GPS : recherche';return}
  el.dataset.s=fix.acc>15?'low':'ok';el.textContent='GPS ± '+Math.round(fix.acc)+' m'}
setInterval(chip,5000);
function takeFix(){if(!fresh()){toast(gpsErr==='denied'||gpsErr==='none'?'GPS indisponible sur cet écran':'Pas de GPS. Reste à découvert quelques secondes.');return null}
  return {lat:r6(fix.lat),lon:r6(fix.lon),acc:Math.round(fix.acc),t:Date.now()}}
function gpsHtml(obj,label){const g=obj.gps;
  return `<div class="fld"><div class="lbl">${label}</div><div class="gpsbox">${g?`<span>${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}</span><span class="acc${g.acc>15?' low':''}">± ${g.acc} m${g.acc>15?' · peu précis':''}</span>`:'<span class="none">Pas encore prise</span>'}</div>

/* ---------- tracé GPS ---------- */
let rec=null,wake=null;
function recTrace(){if(!rec)return null;const c=data.communes.find(x=>x.id===rec.c),d=c&&c.douars.find(x=>x.id===rec.d);return (d&&d.traces.find(x=>x.id===rec.t))||null}
async function wakeOn(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function stopRec(){rec=null;try{wake&&wake.release()}catch(e){}wake=null;renderRec()}
function onFix(){chip();const t=recTrace();if(rec&&!t){stopRec();return}
  if(t&&fix.acc<=25){const last=t.pts[t.pts.length-1];
    if(!last||dist(last,fix)>=8){t.pts.push({lat:r6(fix.lat),lon:r6(fix.lon),acc:Math.round(fix.acc),t:fix.t,kind:''});save();renderRec();liveTrace(t)}}}
function renderRec(){const t=recTrace(),b=$('#recband');b.hidden=!t;if(t)$('#rectxt').textContent=`Tracé en cours · ${Math.round(traceLen(t))} m · ${t.nom||'sans nom'}`}

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{res(im);setTimeout(()=>URL.revokeObjectURL(u),0)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('image'))};im.src=u})}

  const im=await loadImg(file),k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*k)),h=Math.max(1,Math.round(im.naturalHeight*k));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');c.drawImage(im,0,0,w,h);
  const txt=[fmtDate(t),label,g?`${g.lat.toFixed(5)}, ${g.lon.toFixed(5)} (± ${g.acc} m)`:'sans GPS'].filter(Boolean).join('  ·  ');
  let fs=Math.max(13,Math.round(w*0.021));c.font=`600 ${fs}px sans-serif`;
  const tw=c.measureText(txt).width;if(tw>w-24){fs=Math.max(10,Math.floor(fs*(w-24)/tw));c.font=`600 ${fs}px sans-serif`}
  const bh=Math.round(fs*1.9);c.fillStyle='rgba(0,0,0,.62)';c.fillRect(0,h-bh,w,bh);c.fillStyle='#fff';c.textBaseline='middle';c.fillText(txt,12,h-bh/2);

async function buildExport(communes){
  const te=new TextEncoder(),files=new Map(),photoRows=[],nowS=fmtDate(Date.now());
  const S={douars:[],ouv:[],traces:[],pts:[],vis:[]};let kml='',nd=0;
  const dCols=F.douar,oCols=F.ouvrage,head=d=>d.label+(d.unit?` (${d.unit})`:'');
  const tbl=rows=>`<table border="0" cellpadding="3">`+rows.filter(r=>r[1]!==''&&r[1]!=null).map(r=>`<tr><td><b>${xesc(r[0])}</b></td><td>${xesc(r[1])}</td></tr>`).join('')+`</table>`;
  const imgs=ph=>ph.map(p=>`<p><img src="${xesc(files.get(p.id))}" width="420"/>${p.lg?`<br/>${xesc(p.lg)}`:''}</p>`).join('');
  const pm=(name,style,g,desc)=>g?`<Placemark><name>${xesc(name)}</name><styleUrl>#${style}</styleUrl><description><![CDATA[${desc.replace(/]]>/g,']]&gt;')}]]></description><Point><coordinates>${g.lon},${g.lat},0</coordinates></Point></Placemark>`:'';
  for(const c of communes){const cn=san(c.nom)||'Commune',seen=new Set();let kc='';
    c.visites.forEach(v=>{const ivs=v.intervenants.filter(i=>i.nom||i.qualite||i.tel);(ivs.length?ivs:[{}]).forEach(iv=>S.vis.push([c.nom,frDay(v.date),iv.nom||'',iv.qualite||'',iv.tel||'',v.obs||'']))});
    for(const d of c.douars){nd++;let dn=san(d.nom)||'Douar',k=2;const base=dn;while(seen.has(dn))dn=base+'_'+(k++);seen.add(dn);
      let n=0;const name=(holder,tag,what)=>holder.photos.forEach(p=>{n++;const f=`photos/${cn}/${dn}/${dn}_${tag}_${String(n).padStart(3,'0')}.jpg`;files.set(p.id,f);
        photoRows.push([f,c.nom,d.nom,what,fmtDate(p.t),p.lat??'',p.lon??'',p.acc??'',p.lg||''])});
      name(d,'douar','Douar');d.ouvrages.forEach((o,i)=>name(o,(san(OUV[o.type])||'Ouvrage')+(i+1),ouvName(o)));d.traces.forEach((t,i)=>name(t,'Trace'+(i+1),t.nom||'Tracé'));
      const g=d.gps||{},dv=dCols.map(x=>valText(x,d.f[x.k]));
      S.douars.push([c.nom,d.nom,...dv,g.lat??'',g.lon??'',g.acc??'',d.ouvrages.length,countPh(d),missDouar(d).join(' | '),fmtDate(d.t||Date.now())]);
      const st=SIT[d.f.situation];let kd=pm(d.nom||'Douar','sit-'+(d.f.situation||'none'),d.gps,tbl(dCols.map((x,i)=>[x.label,dv[i]]))+imgs(d.photos));
      d.photos.filter(p=>p.lat!=null&&(!d.gps||dist(p,d.gps)>15)).forEach(p=>{kd+=pm('Photo','photo',p,imgs([p]))});
      d.ouvrages.forEach(o=>{const og=o.gps||{},ov=oCols.map(x=>x.types&&!x.types.includes(o.type)?'':valText(x,o.f[x.k]));
        S.ouv.push([c.nom,d.nom,OUV[o.type],...ov,og.lat??'',og.lon??'',og.acc??'',o.photos.map(p=>files.get(p.id).split('/').pop()).join(' ; '),fmtDate(o.t||Date.now())]);
        kd+=pm(ouvName(o),'ouv',o.gps,tbl([['Type',OUV[o.type]],...oCols.map((x,i)=>[x.label,ov[i]])])+imgs(o.photos))});
      d.traces.forEach(t=>{const L=Math.round(traceLen(t));S.traces.push([c.nom,d.nom,t.nom||'',TRACE[t.type]||'',L,t.pts.length,t.note||'']);
        t.pts.forEach((p,i)=>S.pts.push([c.nom,d.nom,t.nom||'',i+1,p.kind||'',p.lat,p.lon,p.acc??'',p.note||'']));
        if(t.pts.length>1)kd+=`<Placemark><name>${xesc(t.nom||'Tracé')}</name><styleUrl>#tr-${t.type||'none'}</styleUrl><description><![CDATA[${tbl([['Type',TRACE[t.type]||''],['Longueur relevée (m)',L],['Remarque',t.note||'']])}]]></description><LineString><tessellate>1</tessellate><coordinates>${t.pts.map(p=>`${p.lon},${p.lat},0`).join(' ')}</coordinates></LineString></Placemark>`;
        t.pts.filter(p=>p.kind&&p.kind!=='Point').forEach(p=>{kd+=pm(p.kind,'sing',p,tbl([['Tracé',t.nom||''],['Remarque',p.note||'']]))});
        t.photos.filter(p=>p.lat!=null).forEach(p=>{kd+=pm('Photo','photo',p,imgs([p]))})});
      kc+=`<Folder><name>${xesc(d.nom||'Douar')}${st?' ('+xesc(st[0])+')':''}</name>${kd}</Folder>`}

  const icon=(id,href,sc)=>`<Style id="${id}"><IconStyle><scale>${sc||1.1}</scale><Icon><href>http://maps.google.com/mapfiles/kml/${href}</href></Icon></IconStyle></Style>`;

  kml=`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${xesc('Diagnostic AEP'+(data.projet?' - '+data.projet:''))}</name>`+
    icon('sit-raccorde','paddle/grn-circle.png')+icon('sit-partiel','paddle/ylw-circle.png')+icon('sit-non','paddle/red-circle.png')+icon('sit-debit','paddle/purple-circle.png')+icon('sit-none','paddle/wht-circle.png')+
    icon('ouv','paddle/blu-square.png')+icon('sing','shapes/placemark_circle.png',0.9)+icon('photo','shapes/camera.png',0.9)+
    line('tr-existante','ffff7800')+line('tr-projetee','ff0000ff')+line('tr-piste','ff00a5ff')+line('tr-none','ff808080')+kml+`</Document></kml>`;
  const sheets=[
   {name:'Douars',head:['Commune','Douar',...dCols.map(head),'Latitude','Longitude','Précision GPS (m)','Ouvrages','Photos','À compléter','Créé le'],rows:S.douars},
   {name:'Ouvrages',head:['Commune','Douar','Type',...oCols.map(head),'Latitude','Longitude','Précision GPS (m)','Photos','Créé le'],rows:S.ouv},
   {name:'Tracés',head:['Commune','Douar','Tracé','Type','Longueur relevée (m)','Points','Remarque'],rows:S.traces},
   {name:'Points des tracés',head:['Commune','Douar','Tracé','N°','Nature du point','Latitude','Longitude','Précision GPS (m)','Remarque'],rows:S.pts},
   {name:'Photos',head:['Fichier','Commune','Douar','Rattachée à','Date','Latitude','Longitude','Précision GPS (m)','Légende'],rows:photoRows},
   {name:'Visites',head:['Commune','Date','Intervenant','Qualité','Téléphone','Compte rendu'],rows:S.vis}];
  const copy=JSON.parse(JSON.stringify({projet:data.projet,responsable:data.technicien,exporte_le:nowS,communes}));
  (function w(x){if(!x||typeof x!=='object')return;if(Array.isArray(x)){x.forEach(w);return}if(Array.isArray(x.photos))x.photos.forEach(p=>{p.fichier=files.get(p.id)||''});Object.values(x).forEach(w)})(copy);
  const z=zipB();
  z.add('LISEZ-MOI.txt',te.encode(['Diagnostic AEP - fichier du '+nowS,data.projet?'Marché : '+data.projet:'',data.technicien?'Responsable du relevé : '+data.technicien:'','',
    '- diagnostic.xlsx : tableaux (douars, ouvrages, tracés, photos, visites)','- doc.kml : à ouvrir avec Google Earth après avoir décompressé le dossier','- photos : classées par commune puis par douar','- donnees.json : toutes les données, pour le traitement au bureau','',
    'Coordonnées en degrés décimaux WGS84. Précision GPS du téléphone : voir la colonne de chaque point.'].join('\r\n')));
  z.add('diagnostic.xlsx',await xlsxBytes(sheets));z.add('doc.kml',te.encode(kml));z.add('donnees.json',te.encode(JSON.stringify(copy,null,1)));
  let np=0;for(const [id,f] of files){const b=await getPhoto(id);if(!b)continue;z.add(f,new Uint8Array(await b.arrayBuffer()),b);np++}
  return {blob:z.end('application/zip'),nd,np}}
